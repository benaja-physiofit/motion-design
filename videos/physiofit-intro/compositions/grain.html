<!DOCTYPE html>
<!--
  grain — registry grain-overlay, adapted: finite iteration count (seek-safe)
  and a very low opacity. Its job is to break up gradient banding in the encode,
  not to be seen as texture.
-->
<html lang="de">
  <head>
    <meta charset="UTF-8">
    <title>Grain</title>
  </head>
  <body>
    <template>
      <style>
        @keyframes grain-noise {
          0%,
          100% {
            transform: translate(0, 0);
          }
          10% {
            transform: translate(-5%, -5%);
          }
          20% {
            transform: translate(-10%, 5%);
          }
          30% {
            transform: translate(5%, -10%);
          }
          40% {
            transform: translate(-5%, 15%);
          }
          50% {
            transform: translate(-10%, 5%);
          }
          60% {
            transform: translate(15%, 0);
          }
          70% {
            transform: translate(0, 10%);
          }
          80% {
            transform: translate(-15%, 0);
          }
          90% {
            transform: translate(10%, 5%);
          }
        }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          pointer-events: none;
        }
        #grain-texture {
          position: absolute;
          top: -50%;
          left: -50%;
          width: 200%;
          height: 200%;
          background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
          opacity: 0.045;
          animation: grain-noise 0.5s steps(1) 8 both;
        }
      </style>

      <div data-hf-id="hf-yo5a" id="root" data-composition-id="grain" data-width="1920" data-height="1080">
        <div data-hf-id="hf-m30w" id="grain-texture"></div>
      </div>

      <script>
        window.__timelines["grain"] = gsap.timeline({ paused: true });
      </script>
    </template>
  </body>
</html>
