<!doctype html>
<!--
  atmosphere — the paper the iris opens onto: white at the centre, a cool
  hint of the brand blue at the edges. Static by design; the lockup carries
  all of the motion.
-->
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>Atmosphere</title>
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          pointer-events: none;
          --atm-paper: #ffffff;
          --atm-paper-edge: #edf1f3;
          background: radial-gradient(ellipse 80% 80% at 50% 50%, var(--atm-paper) 35%, var(--atm-paper-edge) 100%);
        }
      </style>

      <div id="root" data-composition-id="atmosphere" data-width="1920" data-height="1080"></div>

      <script>
        window.__timelines["atmosphere"] = gsap.timeline({ paused: true });
      </script>
    </template>
  </body>
</html>
