<!doctype html>
<!--
  lockup — the official Physiofit Wort-Bild-Marke (paths 1:1 from
  assets/brand/Physiofit_Logo_*.svg, never redrawn).
  0.80s  the P grows out of the ink point (scale from the head's centre), the foot steps in
  1.10s  the Bildmarke glides into its lockup slot (expo.inOut)
  1.48s  PHYSIOFIT rises letter by letter out of a baseline mask
  2.15s  one satin glint travels across mark and wordmark
  3.05s  exhale — blur + fade + slight push, back to paper
  Geometry is in the logo's own SVG units (viewBox crop below); px = units × S.
-->
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>Lockup</title>
  </head>

    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          overflow: hidden;
          pointer-events: none;
          --lk-ink: var(--ink, #1e3542);
          --lk-glint: color-mix(in srgb, var(--lk-ink) 45%, #a9d6e6);
        }
        #lk-lockup {
          position: relative;
          width: 874px; /* 1680 logo units × 0.52 */
          height: 140px;
        }
        .lk-layer,
        .lk-layer svg {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          overflow: visible;
        }
        .lk-ink path {
          fill: var(--lk-ink);
        }
        #lk-mark-move {
          z-index: 2;
        }
        #lk-mark-pop {
          opacity: 0;
          filter: blur(4px);
        }
        #lk-word {
          z-index: 1;
          /* letters rise out of this baseline mask (bottom edge just under the glyphs) */
          clip-path: inset(-20% -2% 25px -2%);
        }
        #lk-glint {
          z-index: 3;
          -webkit-mask-image: linear-gradient(100deg, transparent 0%, transparent 45.5%, rgba(0, 0, 0, 0.8) 50%, transparent 54.5%, transparent 100%);
          mask-image: linear-gradient(100deg, transparent 0%, transparent 45.5%, rgba(0, 0, 0, 0.8) 50%, transparent 54.5%, transparent 100%);
          -webkit-mask-size: 300% 100%;
          mask-size: 300% 100%;
          -webkit-mask-repeat: no-repeat;
          mask-repeat: no-repeat;
          -webkit-mask-position: 100% 0%;
          mask-position: 100% 0%;
        }
        #lk-glint path {
          fill: var(--lk-glint);
        }
      </style>

      <div id="root" data-composition-id="lockup" data-width="1920" data-height="1080">

              <g class="lk-letter"><path d="m556.3 114h-33.4v155.8h33.4v-47.3h36.2c30 0 54.2-24.3 54.2-54.2 0-30-24.3-54.2-54.2-54.2h-36.2zm31.3 79.3h-31.3v-48.7h31.3c13.4 0 24.3 10.9 24.3 24.3 0 13.4-10.9 24.3-24.3 24.3z" /></g>

              <g class="lk-letter"><path d="m1630 114h36.2v155.8h-36.2z" /></g>

          <!-- satin glint: the whole lockup in a lighter tone, revealed through one moving band -->

              <path d="m177.5 270.9c-8.7 4.8-12.9 14.4-10.5 23.7 3.4 13.3 20.8 27.5 59.2 28 13.1-.2 24.9-8.1 30.1-20.2l18.7-43.6c-53.5.6-81.3 3-97.5 12z" />
              <path d="m556.3 114h-33.4v155.8h33.4v-47.3h36.2c30 0 54.2-24.3 54.2-54.2 0-30-24.3-54.2-54.2-54.2h-36.2zm31.3 79.3h-31.3v-48.7h31.3c13.4 0 24.3 10.9 24.3 24.3 0 13.4-10.9 24.3-24.3 24.3z" />
              <path d="m781.6 114v61.2h-63.9v-61.2h-33.4v155.8h33.4v-62.6h63.9v62.6h33.4v-155.8z" />

          </div>
        </div>
      </div>

      <script>
        (function () {
          // Shared beats (seconds) — keep in sync with atmosphere.html and the sonic logo.
          var HIT = 0.8;
          var SLIDE = 1.1;
          var SETTLE = 1.7;
          var LETTERS = 1.48;
          var STAGGER = 0.036;
          var SWEEP = 2.15;
          var EXIT = 3.05;

          // Logo geometry in its own SVG units (viewBox 160 58 1680 270).
          var VB_X = 160;
          var VB_Y = 58;
          var VB_W = 1680;
          var HEAD = { x: 339.5, y: 147.5 }; // centre of the P's round head
          var CENTRE = { x: 1000, y: 193 }; // optical centre of the whole lockup

          var S = document.getElementById("lk-lockup").offsetWidth / VB_W;
          var headPx = { x: (HEAD.x - VB_X) * S, y: (HEAD.y - VB_Y) * S };
          // At the hit the head sits on the ink point (frame centre); it then glides to its slot.
          var dx = (CENTRE.x - HEAD.x) * S;
          var dy = (CENTRE.y - HEAD.y) * S;

          var tl = gsap.timeline({ paused: true });

          // the P grows out of the ink point; the foot steps in under it
          gsap.set("#lk-mark-pop", { transformOrigin: headPx.x + "px " + headPx.y + "px" });
          tl.fromTo("#lk-mark-pop", { scale: 0.16, rotation: -10 }, { scale: 1, rotation: 0, duration: 0.95, ease: "expo.out" }, HIT);
          tl.to("#lk-mark-pop", { opacity: 1, duration: 0.06, ease: "power1.out" }, HIT);
          tl.to("#lk-mark-pop", { filter: "blur(0px)", duration: 0.32, ease: "power2.out" }, HIT);
          tl.fromTo("#lk-foot", { x: -90, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6, ease: "expo.out" }, HIT + 0.12);

          // the Bildmarke glides into its lockup slot
          tl.fromTo("#lk-mark-move", { x: dx, y: dy }, { x: 0, y: 0, duration: SETTLE - SLIDE, ease: "expo.inOut" }, SLIDE);

          // PHYSIOFIT rises out of the baseline mask, left to right
          tl.fromTo(
            "#lk-word .lk-letter",
            { y: 180, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.8, ease: "expo.out", stagger: STAGGER },
            LETTERS,
          );

          // one satin glint across mark and wordmark (registry text-shimmer technique)
          tl.fromTo(
            "#lk-glint",
            { maskPosition: "100% 0%", webkitMaskPosition: "100% 0%" },
            { maskPosition: "0% 0%", webkitMaskPosition: "0% 0%", duration: 0.85, ease: "sine.inOut" },
            SWEEP,
          );

          // exhale
          tl.fromTo(
            "#lk-lockup",
            { opacity: 1, scale: 1, filter: "blur(0px)" },
            { opacity: 0, scale: 1.035, filter: "blur(10px)", duration: 0.6, ease: "power2.in" },
            EXIT,
          );

          tl.seek(0);
          window.__timelines["lockup"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
