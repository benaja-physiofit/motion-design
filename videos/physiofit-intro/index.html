<!doctype html>
<!--
  Physiofit intro "Blende" — 2.5s light sonic-logo sting for product-launch and Academy videos.
  Beats: 0.10 iris closes · 0.72 lock (circle = head) · 0.86 foot · 0.98 wordmark · 2.20 fade · 2.50 end
-->
<html
  lang="de"
  data-composition-variables='[
    {"id":"ink","type":"color","label":"Ink (Physiofit BlueDark)","default":"#1E3542"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #ffffff;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #ffffff;
      }
      [data-composition-id="main"] > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="2.5"
      data-fps="60"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-atmosphere"
        data-composition-id="atmosphere"
        data-composition-src="compositions/atmosphere.html"
        data-start="0"
        data-duration="2.5"
        data-track-index="0"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="el-lockup"
        data-composition-id="lockup"
        data-composition-src="compositions/lockup.html"
        data-start="0"
        data-duration="2.5"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="el-grain"
        data-composition-id="grain"
        data-composition-src="compositions/grain.html"
        data-start="0"
        data-duration="2.5"
        data-track-index="2"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- sonic logo: custom synthesized, composed frame-accurately to the beats above -->
      <audio
        id="el-sonic-logo"
        src="assets/audio/physiofit-sonic-logo.wav"
        data-start="0"
        data-duration="2.5"
        data-track-index="10"
        data-volume="1"
      ></audio>
    </div>

    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
