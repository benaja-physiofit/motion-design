    (function () {
      // Local clock: 0 = 0.25 s in the film. Spoken cues (film time) in comments.
      const tl = gsap.timeline({ paused: true });
      const blurIn = { opacity: 1, filter: "blur(0px)", ease: "expo.out" };

      // Card arrives as a skeleton, like the reference cards.
      tl.fromTo(
        "#au-card",
        { opacity: 0, scale: 0.92, y: 24, filter: "blur(12px)" },
        { ...blurIn, scale: 1, y: 0, duration: 0.6 },
        0,
      );
      tl.fromTo("#au-badge", { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "expo.out" }, 0.25);
      tl.fromTo("#au-dot", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "expo.out" }, 0.32);
      tl.fromTo("#au-icon-svg", { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "expo.out" }, 0.3);

      // "Patientenaufnahme" (0.32-1.4)
      tl.to("#au-title-skel", { opacity: 0, duration: 0.15, ease: "power2.in" }, 0.45);
      tl.fromTo("#au-title", { opacity: 0, filter: "blur(8px)" }, { ...blurIn, duration: 0.3 }, 0.5);

      // "Papierbögen" (2.24): the paper form lands on its skeleton slot.
      tl.fromTo(
        "#au-paper",
        { opacity: 0, y: 40, rotation: -5, filter: "blur(8px)" },
        { ...blurIn, y: 0, rotation: -1.2, duration: 0.6 },
        1.9,
      );
      tl.to("#au-sheet-skel", { opacity: 0, duration: 0.2 }, 2.1);

      // "ausgefüllt" (3.2): pen strokes write into the fields, then the ticks.
      // One stroke per handwritten word, row after row.
      gsap.utils.toArray("#au-paper .au-w").forEach((w, i) => {
        tl.fromTo(w, { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.17, ease: "power1.inOut" }, 2.88 + i * 0.075);
      });
      tl.fromTo("#au-t1", { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.16, ease: "power2.out" }, 3.38);
      tl.fromTo("#au-t2", { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.16, ease: "power2.out" }, 3.5);

      // Status pill fills and shows "Ausgefüllt".
