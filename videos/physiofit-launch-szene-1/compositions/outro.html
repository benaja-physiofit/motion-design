<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: "Montserrat", sans-serif;
          color: #fafafa;
        }
        .outro-ripple {
          position: absolute;
          left: 660px;
          top: 240px;
          width: 600px;
          height: 600px;
          border-radius: 50%;
          border: 3px solid rgba(250, 250, 250, 0.16);
          opacity: 0;
        }
        .outro-stack {
          position: absolute;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
        }
        #outro-text {
          display: flex;
          gap: 40px;
          font-size: 150px;
          font-weight: 900;
          letter-spacing: -0.04em;
          line-height: 1;
        }
        .outro-w {
          display: inline-block;
        }
        /* Physiofit logo, stacked as supplied (mark over wordmark, source ratio kept) */
        #outro-logo {
          margin-top: 96px;
          display: flex;
          flex-direction: column;
          align-items: center;
        }
        #outro-logomark {
          display: block;
          width: 144px;
          height: 145px;
        }
        #outro-wordmark {
          display: block;
          width: 420px;
          height: 59px;
          margin-top: 42px;
        }
      </style>

      <div id="root" data-composition-id="outro" data-width="1920" data-height="1080">
        <div class="outro-ripple" id="outro-ripple1" data-layout-allow-overflow></div>
        <div class="outro-ripple" id="outro-ripple2" data-layout-allow-overflow></div>
        <div class="outro-stack">
          <div id="outro-text">
            <span class="outro-w" id="outro-w1">Alles</span
            ><span class="outro-w" id="outro-w2">in</span
            ><span class="outro-w" id="outro-w3">einer</span
            ><span class="outro-w" id="outro-w4">App.</span>
          </div>
          <div id="outro-logo">
            <img id="outro-logomark" src="../assets/logo/physiofit-mark.svg" alt="Physiofit" />
            <img id="outro-wordmark" src="../assets/logo/physiofit-wordmark.svg" alt="PHYSIOFIT" />
          </div>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });
        // VO line 4 starts at local 0.5s
        tl.fromTo(
          "#outro-w1",
          { opacity: 0, y: 70 },
          { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" },
          0.48,
        );
        tl.fromTo(
          ["#outro-w2", "#outro-w3"],
          { opacity: 0, y: 70 },
          { opacity: 1, y: 0, duration: 0.42, ease: "power3.out", stagger: 0.1 },
          0.74,
        );
        tl.fromTo(
          "#outro-w4",
          { opacity: 0, scale: 0.4 },
          { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.8)" },
          0.95,
        );
        tl.fromTo("#outro-text", { scale: 1 }, { scale: 1.03, duration: 2.5, ease: "none" }, 0.5);
        // Logo: the mark springs in, the wordmark wipes open from the center
        tl.fromTo(
          "#outro-logomark",
          { opacity: 0, scale: 0.3, rotation: -14 },
          { opacity: 1, scale: 1, rotation: 0, duration: 0.6, ease: "back.out(1.7)" },
          1.35,
        );
        tl.fromTo(
          "#outro-wordmark",
          { clipPath: "inset(0% 50% 0% 50%)", opacity: 0 },
          { clipPath: "inset(0% 0% 0% 0%)", opacity: 1, duration: 0.6, ease: "power3.out" },
          1.6,
        );
        tl.fromTo(
          "#outro-ripple1",
          { scale: 0.6, opacity: 0.9 },
          { scale: 2.6, opacity: 0, duration: 2.4, ease: "power1.out", immediateRender: false },
          0.55,
        );
        tl.fromTo(
          "#outro-ripple2",
          { scale: 0.6, opacity: 0.9 },
          { scale: 2.6, opacity: 0, duration: 2.4, ease: "power1.out", immediateRender: false },
          1.35,
        );
        window.__timelines["outro"] = tl;
      </script>
    </template>
  </body>
</html>
