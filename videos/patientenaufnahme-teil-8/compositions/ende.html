      // Logo-only pill, centred: the label half is clipped away until "Portal".
      gsap.set("#en-hub", { x: 109.5, clipPath: "inset(0px 219px 0px 0px round 44px)" });

      const lineIn = (path, node, at) => {
        tl.fromTo(path, { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.45, ease: "power2.inOut" }, at);
        tl.fromTo(node, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.35, ease: "expo.out" }, at + 0.4);
      };
      const fillBtn = (sel, at) =>
        tl.fromTo(
          sel,
          { clipPath: "inset(0% 100% 0% 0% round 46px)" },
          { clipPath: "inset(0% 0% 0% 0% round 46px)", duration: 0.5, ease: "power3.out" },
          at,
        );
      const press = (sel, at) => {
        tl.to(sel, { scale: 0.97, duration: 0.1, ease: "power2.out" }, at);
        tl.to(sel, { scale: 1, duration: 0.3, ease: "expo.out" }, at + 0.1);
      };

      // 01 "Wenn du Hilfe bei der einmaligen Einrichtung benötigst" — the card lands as a skeleton.
      tl.fromTo("#en-help", { opacity: 0, scale: 0.94, y: 20, filter: "blur(12px)" }, { ...blur, scale: 1, y: 0, duration: 0.55 }, 0.15);
      tl.fromTo("#en-help-icon", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.45, ease: "expo.out" }, 0.4);
      tl.to(["#en-help-skel1", "#en-help-skel2"], { opacity: 0, duration: 0.15, ease: "power2.in" }, 0.48);
      tl.fromTo("#en-help-l1", { opacity: 0, filter: "blur(8px)" }, { ...blur, duration: 0.3 }, 0.65);
      tl.fromTo("#en-help-l2", { opacity: 0, filter: "blur(8px)" }, { ...blur, duration: 0.3 }, 0.8);

      // 02 "schreib uns eine Nachricht" — the button fills, Physiofit ("uns") appears and links in.
      fillBtn("#en-btn-msg", 2.9);
      tl.fromTo("#en-hub-wrap", { opacity: 0, y: -14, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.45, ease: "expo.out" }, 3.15);
      lineIn("#en-line-l", "#en-node-l", 3.35);
      press("#en-btn-msg", 3.6);

      // 03 "oder vereinbare einen Gesprächstermin" — the mirrored card on the right.

      tl.fromTo("#en-call-icon", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.45, ease: "expo.out" }, 4.5);
      tl.to("#en-call-skel", { opacity: 0, duration: 0.15, ease: "power2.in" }, 4.4);
      tl.fromTo("#en-call-title", { opacity: 0, filter: "blur(8px)" }, { ...blur, duration: 0.3 }, 4.55);
      fillBtn("#en-btn-call", 4.7);
      lineIn("#en-line-r", "#en-node-r", 4.6);
      press("#en-btn-call", 5.45);

      // 04 "über dein Portal" — the pill opens to "Physiofit | Dein Portal", both links turn cyan.
      // Opens just ahead of "über" (6.16) so the closing line gets ~1 s before the clip ends.

      tl.fromTo("#en-hub-label", { opacity: 0, filter: "blur(8px)" }, { ...blur, duration: 0.3 }, 6.06);
      tl.to(["#en-line-l", "#en-line-r"], { stroke: "#00BAE7", duration: 0.3, ease: "power2.inOut" }, 6.2);
      tl.to(["#en-node-l", "#en-node-r"], { backgroundColor: "#00BAE7", duration: 0.3, ease: "power2.inOut" }, 6.2);

      window.__timelines["ende"] = tl;
