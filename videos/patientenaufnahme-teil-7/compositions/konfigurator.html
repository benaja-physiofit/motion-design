  <script>
    (function () {
      // Local clock: 0 = 0.85 s in the film (hard cut on "Konfigurator").
      const tl = gsap.timeline({ paused: true });
      const SLOT = 124; // field pitch in the form
      const swap = (out, inn, at) => {
        tl.to(out, { opacity: 0, filter: "blur(8px)", duration: 0.15, ease: "power2.in" }, at);
        tl.fromTo(inn, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.28, ease: "expo.out" }, at + 0.1);
      };

      // Initial states (outside the timeline so frame 0 is already right).
      gsap.set(["#kf-form-b", "#kf-f1-b", "#kf-f2-b", "#kf-f3-b", "#kf-save-b"], { opacity: 0 });
      gsap.set([".kf-ghost", "#kf-drop"], { opacity: 0 });
      gsap.set("#kf-cursor", { x: -380, y: -120 });

      // The cut lands slightly large and settles.
      tl.fromTo("#kf-card", { scale: 1.04, filter: "blur(6px)" }, { scale: 1, filter: "blur(0px)", duration: 0.45, ease: "expo.out" }, 0);

      // "ganz individuelle Formulare" (1.6 / 2.4 / 3.2 / 3.95 film): the cursor drags each block into the form.
      [0.75, 1.55, 2.35, 3.1].forEach((land, i) => {
        const g = `#kf-g${i + 1}`;
        const grabX = 356 - 940, grabY = 250 + 100 * i - 650; // cursor offset over block i
        const dy = 62 + 24 * i; // block top -> form slot top
        tl.to("#kf-cursor", { x: grabX, y: grabY, duration: 0.25, ease: "power3.inOut" }, land - 0.72);
        tl.fromTo(g, { opacity: 0, scale: 1 }, { opacity: 1, scale: 1.03, duration: 0.1, ease: "power2.out" }, land - 0.48);
        tl.fromTo("#kf-drop", { opacity: 0, y: SLOT * i }, { opacity: 1, y: SLOT * i, duration: 0.15, ease: "power2.out" }, land - 0.45);
        tl.to(g, { x: 500, y: dy, rotation: -2, duration: 0.42, ease: "power3.inOut" }, land - 0.45);
        tl.to("#kf-cursor", { x: grabX + 500, y: grabY + dy, duration: 0.42, ease: "power3.inOut" }, land - 0.45);
        tl.to(g, { opacity: 0, duration: 0.12, ease: "power2.in" }, land - 0.03);
        tl.to("#kf-drop", { opacity: 0, duration: 0.12, ease: "power2.in" }, land - 0.03);
        tl.fromTo(`#kf-f${i + 1}`, { opacity: 0, scale: 0.97 }, { opacity: 1, scale: 1, duration: 0.35, ease: "expo.out" }, land - 0.05);
      });
      tl.to("#kf-cursor", { x: -180, y: -40, duration: 0.5, ease: "power3.inOut" }, 3.2);

      // "Check-in-Formular" (5.84 film): the same form becomes the check-in.
      swap("#kf-form-a", "#kf-form-b", 4.75);
      swap("#kf-f1-a", "#kf-f1-b", 4.83);
      swap("#kf-f2-a", "#kf-f2-b", 4.93);
      swap("#kf-f3-a", "#kf-f3-b", 5.03);

      // "erstellen" (6.96 film): click on Speichern -> Gespeichert.
      tl.to("#kf-cursor", { x: 500, y: -578, duration: 0.5, ease: "power3.inOut" }, 5.55);
      tl.to("#kf-save", { scale: 0.95, duration: 0.08, ease: "power2.in" }, 6.08);
      tl.to("#kf-save", { scale: 1, duration: 0.3, ease: "expo.out" }, 6.16);
      swap("#kf-save-a", "#kf-save-b", 6.1);

      // Hand-off: the configurator steps back; the check-in card lands on the same ground (7.55 film).
      tl.to("#kf-card", { scale: 0.94, opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power2.in" }, 6.5);

      window.__timelines["konfigurator"] = tl;
    })();
